<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>SMM — архив записи</title>
  <style>
    body { margin: 0; padding: 40px 16px; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1b1f24; background: #f6f7f9; }
    @media (prefers-color-scheme: dark) { body { color: #e6e8eb; background: #11151a; } main { background: #1b1f24 !important; } }
    main { max-width: 620px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    #status { margin: 0 0 16px; }
    ul { padding-left: 20px; margin: 0 0 16px; }
    button { padding: 10px 16px; border-radius: 8px; border: 0; background: #1a73e8; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
    .err { color: #d93025; }
  </style>
</head>
<body>
  <main>
    <h1>Архив записи</h1>
    <p id="status" role="status">Собираю архив…</p>
    <ul id="summary"></ul>
    <button id="again" hidden>Скачать ещё раз</button>
  </main>
  <script src="db.js"></script>
  <script src="zip.js"></script>
  <script src="archive.js"></script>
  <script src="export.js"></script>
</body>
</html>
